[package]
name = "dynacord-config"
version = "0.1.1"
edition = "2021"
default-run = "dynacord-config"

[lib]
name = "dynacord_config_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dynacord-server"
path = "src/bin/server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
mdns-sd = "0.21"
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
